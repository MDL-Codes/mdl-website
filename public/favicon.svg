<!-- The MDL wing, cropped to its centre and set on a navy plate.

     Two things were wrong with the old favicon, which was the full-width
     wordmark SVG reused as-is. It was white on transparent, so on Google's
     white result row and on a light browser tab it was a white shape on white —
     the faint squiggle in the search listing was its edges. And it is a 212x43
     mark, five times wider than it is tall, so squeezed into a square tile it
     rendered a few pixels deep.

     The plate fixes the first: the mark is now paper on navy, and carries its
     own contrast wherever it is placed. The crop fixes the second — the wing's
     long tapered tails run off both edges, which sacrifices the full silhouette
     to give the central chevron enough size to read at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#2B3455"/>
  <g transform="translate(32 32) scale(1.28) translate(-106 -21.5)">
    <path d="M0 0H100.007L106 4.39688L111.993 0H212L119.851 6.63258L106 17.1404L92.1493 6.63258L0 0Z" fill="#F6F4EE"/>
    <path d="M21.9915 3.72617L90.5099 10.0607L104.587 21.0492V43L96.1632 35.9203V27.3501L87.6832 19.1525L21.9915 3.72617Z" fill="#F6F4EE"/>
    <path d="M190.009 3.72617L121.49 10.0607L107.413 21.0492V43L115.837 35.9203V27.3501L124.317 19.1525L190.009 3.72617Z" fill="#F6F4EE"/>
  </g>
</svg>
