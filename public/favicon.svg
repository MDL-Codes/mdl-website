<!-- The wing, unchanged in shape from the mark used across the site — no plate,
     no crop. What is new is that it picks its own ink.

     It used to be `fill="white"` outright, which is right for a dark browser tab
     and wrong everywhere else: on a light-theme tab, and in a Google result row,
     a white mark on white is an invisible one. That is what put a faint squiggle
     in the search listing. Navy is the default and white is the dark-scheme
     override, so the tab looks exactly as it did before while light surfaces get
     a mark they can actually show.

     A plate was tried here and reverted — at tab size a filled navy square with
     a cropped wing in it reads as a muddy block, and the bare silhouette is
     cleaner at 16px than anything boxed. -->
<svg width="212" height="43" viewBox="0 0 212 43" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  path { fill: #2B3455; }
  @media (prefers-color-scheme: dark) { path { fill: #F6F4EE; } }
</style>
<path d="M0 0H100.007L106 4.39688L111.993 0H212L119.851 6.63258L106 17.1404L92.1493 6.63258L0 0Z"/>
<path d="M21.9915 3.72617L90.5099 10.0607L104.587 21.0492V43L96.1632 35.9203V27.3501L87.6832 19.1525L21.9915 3.72617Z"/>
<path d="M190.009 3.72617L121.49 10.0607L107.413 21.0492V43L115.837 35.9203V27.3501L124.317 19.1525L190.009 3.72617Z"/>
</svg>
